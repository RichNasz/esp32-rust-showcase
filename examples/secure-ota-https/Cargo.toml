# AGENT-GENERATED — DO NOT EDIT BY HAND
# Radio pin: git-pin esp-hal, esp-radio, esp-rtos, esp-bootloader-esp-idf,
# esp-alloc, and esp-storage from tag esp-hal-v1.2.1. Never mix crates.io
# esp-rtos / esp-bootloader-esp-idf / esp-storage / esp-alloc with git esp-hal.
# Wi-Fi STA and RMT require esp-hal feature `unstable`. esp-radio is an
# unstable beta. Security here is TLS 1.3 plus an IEEE CRC32. No AES crate.

[package]
name = "secure_ota_https"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
esp-hal = { git = "https://github.com/esp-rs/esp-hal", tag = "esp-hal-v1.2.1", features = ["esp32c6", "unstable"] }
esp-radio = { git = "https://github.com/esp-rs/esp-hal", tag = "esp-hal-v1.2.1", features = ["esp32c6", "unstable", "wifi"] }
esp-rtos = { git = "https://github.com/esp-rs/esp-hal", tag = "esp-hal-v1.2.1", features = ["esp32c6", "embassy", "esp-radio"] }
esp-alloc = { git = "https://github.com/esp-rs/esp-hal", tag = "esp-hal-v1.2.1" }
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal", tag = "esp-hal-v1.2.1", features = ["esp32c6"] }
esp-storage = { git = "https://github.com/esp-rs/esp-hal", tag = "esp-hal-v1.2.1", features = ["esp32c6"] }
embassy-executor = "0.10"
embassy-time = "0.5"
embassy-net = { version = "0.9.0", features = ["dhcpv4", "medium-ethernet", "tcp", "proto-ipv4", "dns"] }
esp-backtrace = { version = "0.20.0", features = ["esp32c6", "panic-handler", "println"] }
esp-println = { version = "0.18.0", features = ["esp32c6", "log-04"] }
# `rustpki` verifies a directly signed P-256 certificate with RustCrypto.
# `webpki` pulls ring, whose build needs riscv32-unknown-elf-gcc.
embedded-tls = { version = "0.19.0", default-features = false, features = ["rustpki", "log"] }
embedded-io = { version = "0.7", default-features = false }
rand_core = { version = "0.6.4", default-features = false }
log = "0.4"
static_cell = "2.1"

[features]
default = ["board-devkitc-c6"]
board-devkitc-c6 = []
board-xiao-c6 = []
